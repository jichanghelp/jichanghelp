<text x="32" y="350" font-size="22" fill="#5A6B87">数字都带测试条件</text>
</g>

<!-- 第四列：核验与披露 -->
<g transform="translate(894 176)">
<rect width="272" height="368" rx="18" fill="#FFFFFF" stroke="#DCE2EE" stroke-width="2"/>
<rect x="0" y="0" width="272" height="8" rx="4" fill="#D4A548"/>
<text x="32" y="60" font-size="30" font-weight="700" fill="#16213E">核验与披露</text>
<text x="32" y="122" font-size="24" fill="#333F58">收录不等于推荐</text>
<text x="32" y="162" font-size="22" fill="#5A6B87">年限分口径 · 曾用名可查</text>
<text x="32" y="216" font-size="24" fill="#333F58">编辑政策</text>
<text x="32" y="256" font-size="22" fill="#5A6B87">实测与模拟图严格分开</text>
<text x="32" y="310" font-size="24" fill="#333F58">推广披露</text>
<text x="32" y="350" font-size="22" fill="#5A6B87">佣金关系写在明处</text>
</g>

<text x="1164" y="580" font-size="22" font-weight="600" fill="#16213E" opacity="0.18" text-anchor="end">机场帮 · jichanghelp.com</text>
</svg>
