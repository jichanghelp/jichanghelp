<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t d">
<title id="t">机场帮内容结构图</title>
<desc id="d">机场帮的四条内容主线：机场收录、客户端与教程、知识库、核验与披露，每条列出主要页面与数量。</desc>
<defs>
<style>text{font-family:system-ui,-apple-system,'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif}</style>
</defs>
<rect width="1200" height="600" fill="#F7F8FC"/>

<!-- 顶部主胶囊 -->
<rect x="440" y="36" width="320" height="72" rx="36" fill="#16213E"/>
<text x="600" y="82" font-size="32" font-weight="700" fill="#FFFFFF" text-anchor="middle">机场帮 · 内容结构</text>

<!-- 连接线 -->
<path d="M600 108 L600 140 M600 140 L172 140 L172 176 M600 140 L458 140 L458 176 M600 140 L744 140 L744 176 M600 140 L1030 140 L1030 176" stroke="#C9D2E2" stroke-width="3" fill="none"/>

<!-- 第一列：机场收录 -->
<g transform="translate(36 176)">
<rect width="272" height="368" rx="18" fill="#FFFFFF" stroke="#DCE2EE" stroke-width="2"/>
<rect x="0" y="0" width="272" height="8" rx="4" fill="#16213E"/>
<text x="32" y="60" font-size="30" font-weight="700" fill="#16213E">机场收录</text>
<text x="32" y="122" font-size="24" fill="#333F58">导航总表 41 家</text>
<text x="32" y="162" font-size="22" fill="#5A6B87">核验状态 · 核对日期</text>
<text x="32" y="216" font-size="24" fill="#333F58">品牌评测页 ×41</text>
<text x="32" y="256" font-size="22" fill="#5A6B87">品牌卡 · 信息边界</text>
<text x="32" y="310" font-size="24" fill="#333F58">四类精选名单</text>
<text x="32" y="350" font-size="22" fill="#5A6B87">老牌 · 性价比 · 稳定 · 高端</text>
</g>

<!-- 第二列：客户端与教程 -->
<g transform="translate(322 176)">
<rect width="272" height="368" rx="18" fill="#FFFFFF" stroke="#DCE2EE" stroke-width="2"/>
<rect x="0" y="0" width="272" height="8" rx="4" fill="#20B8A6"/>
<text x="32" y="60" font-size="30" font-weight="700" fill="#16213E">客户端与教程</text>
<text x="32" y="122" font-size="24" fill="#333F58">客户端总表 69 个</text>
<text x="32" y="162" font-size="22" fill="#5A6B87">停更与付费明确标注</text>
<text x="32" y="216" font-size="24" fill="#333F58">图文教程 29 篇</text>
<text x="32" y="256" font-size="22" fill="#5A6B87">16 篇真机实拍截图</text>
<text x="32" y="310" font-size="24" fill="#333F58">覆盖 8 类平台</text>
<text x="32" y="350" font-size="22" fill="#5A6B87">桌面 · 移动 · 路由器 · 掌机</text>
</g>

<!-- 第三列：知识库 -->
<g transform="translate(608 176)">
<rect width="272" height="368" rx="18" fill="#FFFFFF" stroke="#DCE2EE" stroke-width="2"/>
<rect x="0" y="0" width="272" height="8" rx="4" fill="#E07A3F"/>
<text x="32" y="60" font-size="30" font-weight="700" fill="#16213E">知识库</text>
<text x="32" y="122" font-size="24" fill="#333F58">术语库 25 条</text>
<text x="32" y="162" font-size="22" fill="#5A6B87">倍率 · 专线 · 超售 · 站群</text>
<text x="32" y="216" font-size="24" fill="#333F58">机场杂谈 13 篇</text>
<text x="32" y="256" font-size="22" fill="#5A6B87">测速原理 · DNS 泄漏</text>
