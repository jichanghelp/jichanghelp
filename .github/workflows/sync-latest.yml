# 每天从站点 RSS 同步最近三篇文章到 README（站点未上线时脚本安静跳过）
name: sync latest posts
on:
  schedule:
    - cron: '30 21 * * *' # 北京时间早上 5 点半
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/update-latest.mjs
      - name: commit if changed
        run: |
          if ! git diff --quiet README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "同步最近文章"
            git push
          fi
